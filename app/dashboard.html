<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Agent Dashboard</title>
<style>
:root{
  --bg:#0b1020;--panel:#121a2f;--panel2:#18223d;--text:#f6f8ff;--muted:#9da9c6;
  --line:#24304f;--accent:#7c9cff;--good:#44d7a8;--warn:#ffca70;--bad:#ff7a8a;--violet:#b69cff
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:
radial-gradient(circle at 15% 0%,#1b2a55 0,transparent 34%),
radial-gradient(circle at 100% 0%,#2d1d52 0,transparent 28%),var(--bg);color:var(--text);min-height:100vh}
.shell{max-width:1180px;margin:0 auto;padding:34px 20px 60px}
.header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:26px}
h1{font-size:34px;line-height:1.05;margin:0 0 8px;letter-spacing:-.8px}
.subtitle{color:var(--muted);margin:0}
.badge{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(18,26,47,.82);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}
.card{background:linear-gradient(180deg,rgba(24,34,61,.94),rgba(18,26,47,.94));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.metric .n{font-size:30px;font-weight:800;margin-top:5px}.metric .label{color:var(--muted);font-size:13px}
.good .n{color:var(--good)}.warn .n{color:var(--warn)}.bad .n{color:var(--bad)}.ready .n{color:var(--accent)}.violet .n{color:var(--violet)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0}
input{flex:1;min-width:240px;border:1px solid var(--line);background:#0f1730;color:var(--text);padding:12px 14px;border-radius:12px;outline:none}
button{border:1px solid var(--line);background:#17213c;color:var(--text);padding:11px 14px;border-radius:12px;cursor:pointer}
button.active{background:#26375f;border-color:#4962a2}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:12px;margin-top:16px}
.job{padding:17px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(18,26,47,.78)}
.jobtop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.title{font-weight:750;font-size:16px}.company{color:var(--muted);margin-top:4px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{font-size:12px;padding:6px 9px;border-radius:999px;background:#101936;border:1px solid var(--line);color:#c6d0eb}
.reason{color:#c9d2e8;margin-top:12px;font-size:13px;line-height:1.45}
a{color:#a9baff;text-decoration:none}a:hover{text-decoration:underline}
.empty{padding:40px;text-align:center;color:var(--muted)}
.footer{color:var(--muted);font-size:12px;margin-top:20px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.header{flex-direction:column}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.shell{padding:22px 14px}.jobtop{flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div>
      <h1>Job Agent</h1>
      <p class="subtitle">Autonomous U.S. job discovery and application tracking</p>
    </div>
    <div id="status" class="badge">Checking worker…</div>
  </div>

  <div class="grid">
    <div class="card metric good"><div class="label">Applied</div><div class="n" id="appliedN">0</div></div>
    <div class="card metric warn"><div class="label">Manual Required</div><div class="n" id="manual_requiredN">0</div></div>
    <div class="card metric bad"><div class="label">Blocked</div><div class="n" id="blockedN">0</div></div>
    <div class="card metric ready"><div class="label">Ready</div><div class="n" id="readyN">0</div></div>
    <div class="card metric violet"><div class="label">Unconfirmed</div><div class="n" id="unconfirmedN">0</div></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <input id="search" placeholder="Search company, title, location…">
      <button id="refresh">Refresh</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
    <div class="footer" id="updated"></div>
  </div>
</div>

<script>
const token=new URLSearchParams(location.search).get('token')||'';
const groups=['applied','manual_required','blocked','ready','unconfirmed'];
const labels={applied:'Applied',manual_required:'Manual Required',blocked:'Blocked',ready:'Ready',unconfirmed:'Unconfirmed'};
let data={},active='applied';

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML=groups.map(g=>'<button class="'+(g===active?'active':'')+'" data-g="'+g+'">'+labels[g]+'</button>').join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.g;renderTabs();renderList()});
}
function renderList(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const rows=(data[active]||[]).filter(x=>[x.title,x.company,x.location,x.reason].join(' ').toLowerCase().includes(q));
  const el=document.getElementById('list');
  if(!rows.length){el.innerHTML='<div class="empty">No applications in this view.</div>';return}
  el.innerHTML=rows.map(x=>`
    <div class="job">
      <div class="jobtop">
        <div><div class="title">${esc(x.title)}</div><div class="company">${esc(x.company)}</div></div>
        ${x.apply_url?'<a target="_blank" rel="noreferrer" href="'+esc(x.apply_url)+'">Open job ↗</a>':''}
      </div>
      <div class="meta">
        ${x.location?'<span class="pill">'+esc(x.location)+'</span>':''}
        ${x.resume_profile?'<span class="pill">'+esc(x.resume_profile.toUpperCase())+' résumé</span>':''}
        ${x.fit_score!=null?'<span class="pill">Fit '+Math.round(Number(x.fit_score)*100)+'%</span>':''}
        ${x.posted_at?'<span class="pill">Posted '+new Date(x.posted_at).toLocaleDateString()+'</span>':''}
      </div>
      <div class="reason">${esc(x.reason||'')}</div>
    </div>`).join('');
}
async function load(){
  if(!token){document.getElementById('status').textContent='Missing access token';return}
  try{
    const [a,h]=await Promise.all([
      fetch('/applications?token='+encodeURIComponent(token)).then(r=>{if(!r.ok)throw new Error('Unauthorized');return r.json()}),
      fetch('/health').then(r=>r.json())
    ]);
    data=a;
    groups.forEach(g=>document.getElementById(g+'N').textContent=(a.counts&&a.counts[g])||0);
    document.getElementById('status').textContent=h.auto_submit?'Auto-apply ON · 60s':'Auto-apply OFF';
    document.getElementById('updated').textContent='Last refreshed '+new Date().toLocaleTimeString();
    renderTabs();renderList();
  }catch(e){document.getElementById('status').textContent='Dashboard unavailable';document.getElementById('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
document.getElementById('search').addEventListener('input',renderList);
document.getElementById('refresh').onclick=load;
load();setInterval(load,30000);
</script>
</body>
</html>
